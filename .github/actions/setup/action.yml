name: Set up
description: Node, Bun, and the workspace's dependencies from the lockfile.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - shell: bash
      run: bun install --frozen-lockfile
