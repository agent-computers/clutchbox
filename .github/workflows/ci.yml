name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks first.
  workflow_call:

concurrency:
  # By event too, so a push to main never cancels a release's checks.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Jobs run in parallel; the release workflow, which calls this one, waits for all of them.
  check:
    # Pull requests, which can come from forks, use GitHub's runners, free for public repos; pushes and releases use
    # Blacksmith's faster ones, which the project pays for.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # History back to the base commit, for the extension version check.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun run check:extension-version ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: bun run lint
      - run: bun run typecheck
      # Fails when the schema changed without its migration: generating one must change nothing.
      - run: >-
          bun run db:generate --name missing_migration && test -z "$(git status --porcelain packages/server/migrations)"
      # Route files are generated from the product's route manifest, with literal segment config such as maxDuration;
      # fails when one was edited by hand, is stale, or a hand-written route claims a product URL.
      - run: bun run generate-routes --check

  # The web app's production build, with placeholder configuration: catches what only `next build` sees (route segment
  # config, server-to-client props, CSS). It builds the manual extension zip for the placeholder origin first.
  build:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run build:web
        env:
          APP_ENV: production
          DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
          BETTER_AUTH_URL: https://app.example.com
          BETTER_AUTH_SECRET: build-only-placeholder-not-a-secret-0000
          GOOGLE_CLIENT_ID: build-only-placeholder
          GOOGLE_CLIENT_SECRET: build-only-placeholder
          EXTENSION_ORIGINS: chrome-extension://jpkiadcbmdldnjmfdllbiioieajicacg

  # The README's self-host quickstart: compose builds the image, the app applies migrations to compose's Postgres when
  # it starts, and serves.
  compose:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: |
          cat > .env <<EOF
          BETTER_AUTH_SECRET=$(openssl rand -base64 32)
          CAPTURE_ENCRYPTION_KEY=$(openssl rand -base64 32)
          SMTP_URL=smtp://mailpit:1025
          SMTP_FROM=agents@localhost
          EOF
      - run: docker compose up --build --wait --wait-timeout 180
      - run: curl -sSf http://127.0.0.1:3000/sign-in > /dev/null
      - if: failure()
        run: docker compose logs

  test:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The Playwright adapter's tests drive a real Chromium.
      - run: bunx playwright-core install --with-deps chromium
      - run: bun run test
