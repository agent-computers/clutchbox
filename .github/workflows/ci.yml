name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks first.
  workflow_call:

concurrency:
  # By event too, so a push to main never cancels a release's checks.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # History back to the base commit, for the extension version check.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:extension-version ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: bun run lint
      - run: bun run typecheck
      # The Playwright adapter's tests drive a real Chromium.
      - run: bunx playwright-core install --with-deps chromium
      - run: bun run test

