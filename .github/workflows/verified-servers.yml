name: Verified servers

# Each server on the verified list must serve the file proving it runs at its origin: checked when the list changes,
# and weekly, so a server that stops serving it is noticed and taken off.
on:
  push:
    branches: [main]
    paths: [packages/capture/verified-servers.json, packages/capture/src/servers.ts, scripts/check-verified-servers.ts]
  pull_request:
    paths: [packages/capture/verified-servers.json, packages/capture/src/servers.ts, scripts/check-verified-servers.ts]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run check:verified-servers
