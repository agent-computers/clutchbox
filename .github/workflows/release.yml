name: Release

# Run by hand (Actions > Release > Run workflow, on main) after bumping the extension version. It checks the commit,
# publishes the Chrome Web Store build as a GitHub release, then uploads that same zip to the store and submits it for
# review. A failed job can be re-run alone; the build is kept as an artifact.
on:
  workflow_dispatch:
    inputs:
      store:
        description: Upload to the Chrome Web Store and submit for review
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - if: github.ref != 'refs/heads/main'
        run: |
          echo "Release from main, not $GITHUB_REF."
          exit 1
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(node -p "require('./apps/extension/package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "Extension $version is already released; bump apps/extension/package.json first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
      - run: bun run --cwd apps/extension zip:store
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: apps/extension/.output/agent-computers-${{ steps.version.outputs.version }}-chrome.zip
          if-no-files-found: error

  github:
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extension
      - run: |
          gh release create "v$VERSION" "agent-computers-$VERSION-chrome.zip" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Extension $VERSION" --generate-notes \
            --notes "The Chrome extension's Chrome Web Store build, made by CI from this commit. Install it from the [Chrome Web Store](https://chromewebstore.google.com/detail/agent-computers-%E2%80%94-browser/bjmfpnkjkdkfimdfgbgepmdgdnodpmmi); this zip is what the store gets, for [checking its package against the source](https://github.com/agent-computers/agent-computers/blob/v$VERSION/apps/extension/README.md#verify-the-store-build)."

  # Signs in to Google with this run's GitHub identity (Workload Identity Federation), so no key is stored here. The
  # chrome-web-store environment allows only main, and the pool accepts only this workflow on main.
  store:
    needs: [build, github]
    if: inputs.store
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: chrome-web-store
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      ITEM: https://chromewebstore.googleapis.com/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/bjmfpnkjkdkfimdfgbgepmdgdnodpmmi
      UPLOAD: https://chromewebstore.googleapis.com/upload/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/bjmfpnkjkdkfimdfgbgepmdgdnodpmmi
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extension
      - id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Upload
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" "$@"; }
          state=$(api -X POST -T "agent-computers-$VERSION-chrome.zip" "$UPLOAD:upload" | tee /dev/stderr | jq -r .uploadState)
          # Large packages finish processing asynchronously.
          for _ in $(seq 30); do
            [ "$state" = IN_PROGRESS ] || break
            sleep 10
            state=$(api "$ITEM:fetchStatus" | tee /dev/stderr | jq -r .lastAsyncUploadState)
          done
          [ "$state" = SUCCEEDED ] || { echo "Upload ended in $state."; exit 1; }
      - name: Submit for review
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{}' "$ITEM:publish"
